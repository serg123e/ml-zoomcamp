[project]
name = "corovans-death-prediction"
version = "0.1.0"
description = "ML Zoomcamp 2026 midterm: predict player death in a wave of the Corovans game"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.119.1",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "scikit-learn==1.7.2",
    "uvicorn==0.38.0",
    "xgboost-cpu==3.0.5",
]

[dependency-groups]
dev = [
    "jupyter==1.1.1",
    "matplotlib==3.10.6",
    "requests==2.32.5",
    "seaborn==0.13.2",
]

[tool.uv]
exclude-newer = "2026-09-14T23:59:59Z"
